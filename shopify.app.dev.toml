# DEV app only — "ShopiReachBoost AI Dev". Install on the dev store (cartncod-form) for testing.
# The live app under review is shopify.app.toml; never run `shopify app deploy --config shopify.app.toml` while testing.
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c73b3a9c2cc96f5211c08390e0442f3d"
name = "ShopiReachBoost AI Dev"
# Admin (Next.js, `npm run dev` in frontend/) on this computer, reached through the ngrok tunnel
# `ngrok http --url=subsonic-regain-bounce.ngrok-free.dev 3030`. Chrome blocks http://localhost inside Shopify.
application_url = "https://subsonic-regain-bounce.ngrok-free.dev/admin"
embedded = true

[access_scopes]
# Same scopes as the live app.
scopes = "read_orders,read_products,write_discounts"

[auth]
# Backend (Express, `npm run dev:local` in backend/); the admin forwards /api/* to it in dev.
redirect_urls = [
  "https://subsonic-regain-bounce.ngrok-free.dev/api/auth/callback",
  "https://subsonic-regain-bounce.ngrok-free.dev/api/auth/billing/callback"
]

[webhooks]
# Same API version as the live app. No webhook subscriptions: Shopify cannot reach localhost.
api_version = "2026-10"

[build]
# Keep the ngrok URLs above; the project has no shopify.web.toml for the CLI to tunnel.
automatically_update_urls_on_dev = false
