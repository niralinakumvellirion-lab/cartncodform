name = "ShopireachboostAI"
client_id = "b2cafd271c21b90a630528234402b0a1"
application_url = "https://app.shopireachboost.com/admin"
embedded = true

[auth]
redirect_urls = [
  "https://api.shopireachboost.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://api.shopireachboost.com/api/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = ["carts/create", "carts/update"]
  uri = "https://api.shopireachboost.com/api/webhooks/cart"

  [[webhooks.subscriptions]]
  topics = ["checkouts/create", "checkouts/update"]
  uri = "https://api.shopireachboost.com/api/webhooks/checkout"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://api.shopireachboost.com/api/webhooks/order"

[access_scopes]
scopes = "read_orders,read_customers,write_customers,read_products,write_discounts,read_discounts"

[app_proxy]
url = "https://api.shopireachboost.com/apps/cartncodform"
subpath = "cartncodform"
prefix = "apps"

[extensions]
  [[extensions.theme]]
  handle = "cartncodform-push"
  path = "extensions/cartncodform-embed"
