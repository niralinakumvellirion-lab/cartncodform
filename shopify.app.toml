name = "CartnCodForm"
client_id = "b2cafd271c21b90a630528234402b0a1"
application_url = "https://cartncodform-backend.onrender.com"
embedded = false

[auth]
redirect_urls = [
  "https://cartncodform-backend.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/api/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/api/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/api/webhooks/shop/redact"

[access_scopes]
scopes = "read_orders,read_customers,write_customers,write_script_tags,read_script_tags,read_products"

[app_proxy]
url = "https://cartncodform-backend.onrender.com/apps/cartncodform"
subpath = "cartncodform"
prefix = "apps"

[extensions]
  [[extensions.theme]]
  handle = "cartncodform-push"
  path = "extensions/cartncodform-embed"
