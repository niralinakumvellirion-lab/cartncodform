<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CartnCodForm — Push Popup Test</title>
  <!-- Fake Shopify globals so SHOP_DOMAIN detection has something to find -->
  <meta name="myshopify-domain" content="cartncod-form.myshopify.com">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button { background: #667eea; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #334155; }
    #log {
      background: #020617; border: 1px solid #1e293b; border-radius: 8px;
      padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      height: 60vh; overflow-y: auto;
    }
    .log-error { color: #f87171; }
    .log-warn { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>CartnCodForm — Push Popup Test</h1>
  <p style="font-size:13px;color:#94a3b8;margin:0 0 12px">
    Loads <code>/cartncodform-push.js</code> and mirrors every <code>console</code> call below.
    Open on the phone at <code>https://cartncodform-backend.onrender.com/test-popup.html</code>.
  </p>

  <div class="row">
    <button onclick="window.ccfShowPopup && window.ccfShowPopup()">Show popup</button>
    <button class="secondary" onclick="window.ccfHidePopup && window.ccfHidePopup()">Hide popup</button>
    <button class="secondary" onclick="document.getElementById('log').textContent=''">Clear log</button>
    <button class="secondary" onclick="try{localStorage.removeItem('ccf_push_subscribed');sessionStorage.removeItem('ccf_push_denied_session');addLine('cleared ccf storage');}catch(e){}">Reset state</button>
  </div>

  <div id="log"></div>

  <script>
    (function () {
      var logEl = document.getElementById('log');
      window.addLine = function (msg, cls) {
        var line = document.createElement('div');
        if (cls) line.className = cls;
        line.textContent = '[' + new Date().toISOString().substr(11, 8) + '] ' + msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      };
      function fmt(args) {
        return Array.prototype.map.call(args, function (a) {
          if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
          if (typeof a === 'object') {
            try { return JSON.stringify(a); } catch (e) { return String(a); }
          }
          return String(a);
        }).join(' ');
      }
      ['log', 'info', 'warn', 'error'].forEach(function (level) {
        var orig = console[level].bind(console);
        console[level] = function () {
          orig.apply(null, arguments);
          addLine(fmt(arguments), level === 'error' ? 'log-error' : level === 'warn' ? 'log-warn' : '');
        };
      });
      window.addEventListener('error', function (e) {
        addLine('window.onerror: ' + (e.message || e.error), 'log-error');
      });
      window.addEventListener('unhandledrejection', function (e) {
        addLine('unhandledrejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason), 'log-error');
      });
      addLine('test-popup.html ready — loading cartncodform-push.js');
    })();
  </script>

  <script defer src="/cartncodform-push.js"></script>
</body>
</html>
